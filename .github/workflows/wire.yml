name: Harvest resistance wire
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the pre-push `git merge FETCH_HEAD` retry loop below always has
          # a merge base. This job runs every 6h and only writes wire.json; on a default
          # shallow (depth-1) clone, if main advanced past the tip the merge can fail with
          # "refusing to merge unrelated histories". fetch-depth: 0 closes that gap.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install feedparser
      - name: Harvest wire.json
        run: python wire_harvest.py
      - name: Commit if changed
        run: |
          git config user.name  "wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wire.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: refresh wire.json"
          BR="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR" || true
            if git merge -X ours FETCH_HEAD -m "merge remote; keep fresh wire.json" && git push origin HEAD:"$BR"; then
              echo "pushed"; exit 0
            fi
            git merge --abort 2>/dev/null || true
            echo "push race, retry $i"; sleep 6
          done
          echo "push failed after retries"; exit 1
