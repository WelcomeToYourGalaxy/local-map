# .github/workflows/projects.yml
# Daily harvest of the "Live projects" layer -> projects.json.gz (committed to repo root).
# This is the LIVE-PROJECTS harvester (harvest_projects.py). It is SEPARATE from
# the news wire (wire_harvest.py / wire.yml) and from the weekly sharded OSM run
# (projects_osm.yml). All three are distinct workflows and all must exist in the repo.
name: Harvest live projects

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC
  workflow_dispatch: {}         # manual "Run workflow" button

# allow the job to push the refreshed projects.json.gz back to the repo
permissions:
  contents: write

concurrency:
  group: harvest-projects
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # sources are budget-capped inside the script

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the pre-push rebase (below) always has a merge base,
          # even on a repo with a long run of daily projects.json.gz commits.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # harvest_projects.py is almost pure stdlib. Its only third-party imports are:
        #   permitstack -> the US PermitStack source
        #   pdfplumber  -> the US MILCON (DoD C-1) source
        run: |
          python -m pip install --upgrade pip
          pip install permitstack pdfplumber

      - name: Run harvester
        env:
          # --- credentials (add these as repo Settings > Secrets and variables > Actions) ---
          PERMITSTACK_API_KEY: ${{ secrets.PERMITSTACK_API_KEY }}   # US building permits (source skips if unset)
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}           # India data.gov.in (source skips if unset)
          # Ethiopia mining-licence APPLICATIONS (Landfolio cadastre). OFF by default.
          # To do a one-shot live pull: set FLEXICADASTRE to "1" here AND add a FRESH
          # FLEXICADASTRE_ETH_TOKEN secret (the viewer's session token; it expires within
          # hours, so a scheduled run needs the page-scrape token route, not a static secret).
          FLEXICADASTRE: "0"
          FLEXICADASTRE_ETH_TOKEN: ${{ secrets.FLEXICADASTRE_ETH_TOKEN }}
          # --- optional tuning (all have safe defaults; leave unset to accept them) ---
          # MILCON_C1_FY: "2026"        # pin the DoD C-1 fiscal year (default: try newest, then current)
          # HARVEST_FEDERATIONS: "1"    # include CKAN/ODS/GeoNode/WFS/OGC-API federations
          # HARVEST_OSM: "0"            # keep OSM OFF here; it runs in projects_osm.yml
        run: |
          python harvest_projects.py

      - name: Commit refreshed projects.json.gz
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain projects.json.gz)" ]; then
            echo "No change in projects.json.gz -- nothing to commit."
            exit 0
          fi
          git add projects.json.gz
          git commit -m "chore(projects): daily harvest $(date -u +%Y-%m-%d)"
          # The harvest takes ~2h. During that window other workflows (projects_osm.yml,
          # wire.yml) and manual commits can advance main, so a plain `git push` races and
          # is rejected "! [rejected] main -> main (fetch first)". This job only ever
          # changes projects.json.gz, which it FULLY regenerates each run, so rebasing our
          # single commit onto the latest main is always safe (our freshly-harvested file
          # wins). Retry a few times to ride out concurrent pushes to the same ref.
          # safe-push (patch_workflow_push)
          # The file is BINARY and fully regenerated each run, so it can never be
          # merged and never needs to be: our version simply has to land on top of
          # whatever main is now. Rebasing here is what broke earlier runs - it
          # conflicted on the binary file and left a detached HEAD that every
          # subsequent retry inherited.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected (main advanced); replaying onto origin/main"
            git rebase --abort 2>/dev/null || true   # clear wreckage from any earlier attempt
            git fetch origin main
            git reset --soft FETCH_HEAD              # keep our freshly built file
            git add projects.json.gz
            git commit -m "chore(projects): daily harvest $(date -u +%Y-%m-%d)" || true
            sleep $((attempt * 5))
          done
          echo "::error::projects.json.gz push failed after 5 rebase attempts (main kept advancing)"
          exit 1
