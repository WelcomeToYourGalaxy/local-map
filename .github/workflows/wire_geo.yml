name: wire-geo

# Pins wire items to the projects they are about. Runs after the wire feed
# refreshes, so wire_geo.json never goes stale against wire.json.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"   # daily, shortly after the wire job

concurrency:
  group: wire-geo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  geolocate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Selftest (no network)
        run: python3 geolocate_wire.py --selftest

      - name: Cache country boundaries
        uses: actions/cache@v4
        with:
          path: boundary_cache
          key: cgaz-boundaries-v1

      - name: Geolocate
        run: |
          python3 geolocate_wire.py \
            --wire wire.json \
            --projects projects.json \
            --min-overlap 2 \
            --cache boundary_cache \
            --merge wire_geo.json \
            --max-age-days 365 \
            --out wire_geo.json \
            --report wire_geo_report.json

      - name: Commit
        run: |
          git config user.name  "wire-geo"
          git config user.email "wheelock.chris@gmail.com"
          git add wire_geo.json wire_geo_report.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "wire-geo: refresh [skip ci]"
          # safe-push (patch_workflow_push)
          # The file is BINARY and fully regenerated each run, so it can never be
          # merged and never needs to be: our version simply has to land on top of
          # whatever main is now. Rebasing here is what broke earlier runs - it
          # conflicted on the binary file and left a detached HEAD that every
          # subsequent retry inherited.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected (main advanced); replaying onto origin/main"
            git rebase --abort 2>/dev/null || true   # clear wreckage from any earlier attempt
            git fetch origin main
            git reset --soft FETCH_HEAD              # keep our freshly built file
            git add wire_geo.json wire_geo_report.json
            git commit -m "wire-geo: refresh [skip ci]" || true
            sleep $((attempt * 5))
          done
          echo "::error::push failed after 5 attempts"
          exit 1
